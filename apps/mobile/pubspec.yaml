name: payn_mobile
description: Payn mobile client for the European fintech marketplace platform.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.7.0

dependencies:
  amplitude_flutter: ^4.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.8.0+1
  fl_chart: ^0.68.0
  flutter_dotenv: ^5.2.1
  # Firebase: core init + Cloud Messaging for push delivery, plus
  # flutter_local_notifications so foreground pushes still render a
  # banner (FCM only shows banners in background by default on iOS).
  firebase_core: ^3.6.0
  firebase_analytics: ^11.3.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3
  go_router: ^14.8.1
  google_fonts: ^6.3.1
  intl: ^0.20.2
  shared_preferences: ^2.5.2
  # Supabase Flutter — real auth (email + OAuth) so the mobile app shares
  # the same user database as web. OAuth provider flows (Google/Facebook)
  # are handled via signInWithOAuth → in-app browser → Supabase callback.
  supabase_flutter: ^2.8.4
  url_launcher: ^6.3.1
  url_launcher_ios: ^6.3.2
  google_sign_in: ^6.2.1
  # SHA-256 nonce generation for Supabase Google Sign-In (transitive dep promoted)
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

dependency_overrides:
  path_provider_foundation: 2.5.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
