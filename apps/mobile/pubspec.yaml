name: payn_mobile
description: Payn mobile client for the European fintech marketplace platform.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.7.0

dependencies:
  amplitude_flutter: ^4.0.0
  flutter:
    sdk: flutter
  dio: ^5.8.0+1
  fl_chart: ^0.68.0
  flutter_dotenv: ^5.2.1
  go_router: ^14.8.1
  google_fonts: ^6.3.1
  shared_preferences: ^2.5.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

dependency_overrides:
  path_provider_foundation: 2.5.1

flutter:
  uses-material-design: true
  assets:
    - assets/
